apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peers.kilo.squat.ai
spec:
  group: kilo.squat.ai
  names:
    kind: Peer
    listKind: PeerList
    plural: peers
    singular: peer
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                allowedIPs:
                  type: array
                  items:
                    type: string
                endpoint:
                  type: object
                  properties:
                    dnsOrIP:
                      type: object
                      properties:
                        dns:
                          type: string
                        ip:
                          type: string
                    port:
                      type: integer
                      format: int32
                persistentKeepalive:
                  type: integer
                presharedKey:
                  type: string
                publicKey:
                  type: string
