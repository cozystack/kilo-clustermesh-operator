name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

jobs:
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  charts:
    name: Package and push Helm charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Package and push operator chart
        run: |
          helm package charts/kilo-clustermesh-operator --destination _dist/
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/cozystack
          done
      - name: Package and push Cozystack package
        run: |
          rm -rf _dist && mkdir _dist
          helm dependency update packages/system/kilo-clustermesh-operator
          helm package packages/system/kilo-clustermesh-operator --destination _dist/
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/cozystack
          done
