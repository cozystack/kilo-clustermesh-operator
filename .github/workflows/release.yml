name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

jobs:
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Read chart appVersion
        id: appver
        run: |
          appver=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/kilo-clustermesh-operator/Chart.yaml)
          echo "value=$appver" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:${ver}"
              echo "ghcr.io/${{ github.repository }}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            sha="${GITHUB_SHA::8}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:main"
              echo "ghcr.io/${{ github.repository }}:sha-${sha}"
              echo "ghcr.io/${{ github.repository }}:${{ steps.appver.outputs.value }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  charts:
    name: Package and push Helm charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      # flux push artifact uses docker's config.json for OCI auth, separate
      # from helm's own keyring. Without this step the bundle push gets
      # `DENIED: requested access to the resource is denied`.
      - name: Log in to GHCR (docker)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On tag pushes the release version is authoritative: stamp it into
      # both Chart.yaml files (operator chart + Cozystack wrapper) before
      # `helm package` so the published artifacts carry the tag instead
      # of the in-repo dev-base appVersion. The repo's Chart.yaml stays
      # at the dev base (0.1.0); only tagged releases get stamped.
      - name: Stamp release version into chart metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          sed --in-place \
            --expression "s/^version: .*/version: ${ver}/" \
            --expression "s/^appVersion: .*/appVersion: \"${ver}\"/" \
            charts/kilo-clustermesh-operator/Chart.yaml
          # Wrapper: align appVersion AND the local-path dependency pin
          # on the operator chart so `helm dependency update` resolves
          # against the stamped inner chart.
          sed --in-place \
            --expression "s/^appVersion: .*/appVersion: \"${ver}\"/" \
            --expression "s/^    version: \".*\"/    version: \"${ver}\"/" \
            packages/system/kilo-clustermesh-operator/Chart.yaml
          echo "--- stamped operator chart ---"
          cat charts/kilo-clustermesh-operator/Chart.yaml
          echo "--- stamped wrapper chart ---"
          cat packages/system/kilo-clustermesh-operator/Chart.yaml
      - name: Package and push operator chart
        run: |
          # Push under /charts/ subpath so the chart's OCI repository does
          # not collide with the container image at the parent path.
          helm package charts/kilo-clustermesh-operator --destination _dist/
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/cozystack/charts
          done
      - name: Package and push Cozystack package
        run: |
          rm -rf _dist && mkdir _dist
          helm dependency update packages/system/kilo-clustermesh-operator
          helm package packages/system/kilo-clustermesh-operator --destination _dist/
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/cozystack/charts
          done

      # Build a Cozystack-package bundle OCI artifact from the packages/
      # directory. This shape lets cozystack-engine auto-create the
      # ArtifactGenerator from the PackageSource (init.yaml) and unblocks
      # the install via Package -> HelmRelease.
      - name: Install flux CLI
        uses: fluxcd/flux2/action@v2.8.8
      - name: Compute bundle tag
        id: bundletag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/kilo-clustermesh-operator/Chart.yaml)
            ver="${ver}-sha-${GITHUB_SHA::8}"
          fi
          echo "value=$ver" >> "$GITHUB_OUTPUT"
      - name: Push Cozystack package bundle
        run: |
          # The wrapper chart at packages/system/kilo-clustermesh-operator
          # already has its dependency tarball populated by the preceding
          # "Package and push Cozystack package" step, so the extracted
          # artifact is self-contained.
          flux push artifact \
            "oci://ghcr.io/${{ github.repository_owner }}/kilo-clustermesh-operator-packages:${{ steps.bundletag.outputs.value }}" \
            --path=packages \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ steps.bundletag.outputs.value }}@sha1:${{ github.sha }}"
