name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]

jobs:
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Read chart appVersion
        id: appver
        run: |
          appver=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' charts/kilo-clustermesh-operator/Chart.yaml)
          echo "value=$appver" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:${ver}"
              echo "ghcr.io/${{ github.repository }}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            sha="${GITHUB_SHA::8}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:main"
              echo "ghcr.io/${{ github.repository }}:sha-${sha}"
              echo "ghcr.io/${{ github.repository }}:${{ steps.appver.outputs.value }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

  charts:
    name: Package and push Helm charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      # On tag pushes the release version is authoritative: stamp it into
      # the operator chart's Chart.yaml before `helm package` so the
      # published artifact carries the tag instead of the in-repo dev-base
      # appVersion. The repo's Chart.yaml stays at the dev base (0.1.0);
      # only tagged releases get stamped.
      - name: Stamp release version into chart metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          sed --in-place \
            --expression "s/^version: .*/version: ${ver}/" \
            --expression "s/^appVersion: .*/appVersion: \"${ver}\"/" \
            charts/kilo-clustermesh-operator/Chart.yaml
          echo "--- stamped operator chart ---"
          cat charts/kilo-clustermesh-operator/Chart.yaml
      - name: Package and push operator chart
        run: |
          # Push under /charts/ subpath so the chart's OCI repository does
          # not collide with the container image at the parent path.
          helm package charts/kilo-clustermesh-operator --destination _dist/
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/cozystack/charts
          done
