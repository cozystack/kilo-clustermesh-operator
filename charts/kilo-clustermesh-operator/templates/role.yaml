apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kilo-clustermesh-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kilo-clustermesh-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
