---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kilo-clustermesh-operator
  namespace: cozy-system
spec:
  interval: 5m
  url: oci://ghcr.io/cozystack/kilo-clustermesh-operator-packages
  ref:
    # Match pre-release tags too (e.g. "0.1.0-sha-<short>"): per semver,
    # constraints without a pre-release suffix do not include pre-release
    # versions, so ">=0.0.0" alone leaves the OCIRepository stuck on
    # "no match found" until a stable tag is cut. Including "-0" widens
    # the constraint to all valid semver versions.
    semver: ">=0.0.0-0"
---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.kilo-clustermesh-operator
  namespace: cozy-system
spec:
  sourceRef:
    kind: OCIRepository
    name: kilo-clustermesh-operator
    namespace: cozy-system
    path: /
  variants:
  - name: default
    components:
    - name: kilo-clustermesh-operator
      path: system/kilo-clustermesh-operator
      install:
        namespace: cozy-kilo-clustermesh-operator
        releaseName: kilo-clustermesh-operator
---
apiVersion: cozystack.io/v1alpha1
kind: Package
metadata:
  name: cozystack.kilo-clustermesh-operator
  namespace: cozy-system
spec:
  variant: default
