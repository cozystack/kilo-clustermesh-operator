---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - create
  - get
  - update
- apiGroups:
  - kilo.squat.ai
  resources:
  - clustermeshes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kilo.squat.ai
  resources:
  - clustermeshes/finalizers
  verbs:
  - update
- apiGroups:
  - kilo.squat.ai
  resources:
  - clustermeshes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kilo.squat.ai
  resources:
  - peers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
