# This rule is not used by the project kilo-clustermesh-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kilo.squat.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kilo-clustermesh-operator
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: clustermesh-editor-role
rules:
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes/status
    verbs:
      - get
