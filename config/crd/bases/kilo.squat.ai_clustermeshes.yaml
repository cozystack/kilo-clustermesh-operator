---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clustermeshes.kilo.squat.ai
spec:
  group: kilo.squat.ai
  names:
    kind: ClusterMesh
    listKind: ClusterMeshList
    plural: clustermeshes
    shortNames:
    - cm
    singular: clustermesh
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterMesh is the Schema for the clustermeshes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterMesh.
            properties:
              clusters:
                description: Clusters is the list of clusters to connect in this mesh.
                items:
                  description: ClusterEntry describes a single cluster participating
                    in the mesh.
                  properties:
                    additionalCIDRs:
                      description: |-
                        AdditionalCIDRs are extra CIDRs to advertise into the mesh
                        (e.g., host-network ranges, external subnets).
                      items:
                        type: string
                      type: array
                    kubeconfigSecretRef:
                      description: |-
                        KubeconfigSecretRef references a Secret containing the kubeconfig
                        for this cluster. Required for non-local clusters.
                      properties:
                        key:
                          description: Key within the Secret data.
                          type: string
                        name:
                          description: Name of the Secret.
                          type: string
                      required:
                      - key
                      - name
                      type: object
                    local:
                      description: |-
                        Local indicates this is the cluster where the controller runs.
                        Exactly one cluster in the mesh must be marked as local.
                        No kubeconfigSecretRef is needed for the local cluster.
                      type: boolean
                    name:
                      description: |-
                        Name is a unique identifier for this cluster within the mesh.
                        Used as label value and status key. Must be a valid DNS-1123 label.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9\-]{0,61}[a-z0-9])?$
                      type: string
                    persistentKeepalive:
                      description: |-
                        PersistentKeepalive is the interval in seconds at which WireGuard
                        sends keepalive packets to peers in this cluster. Set to a non-zero
                        value (e.g. 25) for clusters behind NAT so that the stateful NAT
                        mapping is refreshed before it expires, enabling bidirectional traffic
                        even when the cluster has no directly-routable public IP.
                        0 disables persistent keepalive (default).
                      maximum: 65535
                      minimum: 0
                      type: integer
                    podCIDRs:
                      description: |-
                        PodCIDRs is the list of pod network CIDRs for this cluster.
                        Node.Spec.PodCIDRs must be a subset of these CIDRs.
                        Multiple entries support dual-stack (IPv4 + IPv6).
                      items:
                        type: string
                      minItems: 1
                      type: array
                    serviceCIDR:
                      description: |-
                        ServiceCIDR is the Kubernetes service network CIDR for this cluster.
                        If set, it will be advertised via an anchor Peer so that services
                        in this cluster are reachable from other mesh members.
                      type: string
                    wireguardCIDR:
                      description: |-
                        WireguardCIDR is the CIDR for Kilo's WireGuard interface (kilo0) addresses.
                        Each node's kilo.squat.ai/wireguard-ip must have its host IP within this CIDR.
                        The annotation may carry any prefix length (e.g. "10.4.0.1/32" upstream Kilo
                        or "10.4.0.1/16" cozystack-patched Kilo); only the host portion is validated.
                      type: string
                    wireguardPort:
                      default: 51820
                      description: |-
                        WireguardPort is the UDP port of Kilo's WireGuard endpoint on each node in
                        this cluster. Used as a fallback when the operator synthesises the
                        endpoint from Node.Status.Addresses (i.e. neither
                        kilo.squat.ai/clustermesh-endpoint nor kilo.squat.ai/force-endpoint is set
                        on a node). Defaults to 51820.
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - name
                  - podCIDRs
                  - wireguardCIDR
                  type: object
                minItems: 2
                type: array
            required:
            - clusters
            type: object
          status:
            description: status defines the observed state of ClusterMesh.
            properties:
              clusters:
                description: Clusters contains per-cluster status information.
                items:
                  description: ClusterStatus holds the observed state for a single
                    cluster in the mesh.
                  properties:
                    name:
                      description: Name matches ClusterEntry.Name.
                      type: string
                    registeredPeers:
                      description: RegisteredPeers is the number of Peer objects created
                        for this cluster's nodes.
                      type: integer
                    skippedNodes:
                      description: SkippedNodes is the number of nodes that failed
                        validation and were not peered.
                      type: integer
                  required:
                  - name
                  - registeredPeers
                  - skippedNodes
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
